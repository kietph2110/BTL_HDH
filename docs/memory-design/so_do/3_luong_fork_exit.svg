<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><marker id="aFDEBDD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FDEBDD"/></marker><marker id="aF1F2F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F1F2F4"/></marker><marker id="a2F6FD6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FD6"/></marker><marker id="aE07A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker><marker id="a1F2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="aE6EEFB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6EEFB"/></marker><marker id="aD14343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D14343"/></marker><marker id="aE3F4EC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E3F4EC"/></marker><marker id="a23966A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23966A"/></marker><marker id="aFBE4E4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBE4E4"/></marker><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="600" y="38.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Luồng xử lý trang chung khi fork() và exit()</text><rect x="40" y="70" width="520" height="44" rx="10" fill="#2F6FD6" stroke="#2F6FD6" stroke-width="1.5"/><text x="300.0" y="92.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">fork()  →  uvmcopy(old, new, sz)</text><rect x="640" y="70" width="520" height="44" rx="10" fill="#23966A" stroke="#23966A" stroke-width="1.5"/><text x="900.0" y="92.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">exit() / exec()  →  uvmfree()</text><rect x="150" y="150" width="300" height="50" rx="8" fill="#E6EEFB" stroke="#2F6FD6" stroke-width="1.5"/><text x="300.0" y="175.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Duyệt từng trang va = 0 … sz</text><path d="M300,114 L300,148" fill="none" stroke="#2F6FD6" stroke-width="2" marker-end="url(#a2F6FD6)" stroke-linejoin="round"/><polygon points="300,220.0 415.0,265 300,310.0 185.0,265" fill="#FDEBDD" stroke="#E07A2E" stroke-width="1.5"/><text x="300" y="265.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">PTE có PTE_SH?</text><path d="M300,200 L300,218" fill="none" stroke="#2F6FD6" stroke-width="2" marker-end="url(#a2F6FD6)" stroke-linejoin="round"/><rect x="40" y="350" width="250" height="96" rx="8" fill="#FDEBDD" stroke="#E07A2E" stroke-width="1.5"/><text x="165.0" y="381.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">mappages(new, va, pa, flags)</text><text x="165.0" y="398.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">— dùng LẠI pa của cha —</text><text x="165.0" y="414.90000000000003" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">kref_inc(pa)</text><rect x="320" y="350" width="250" height="96" rx="8" fill="#E6EEFB" stroke="#2F6FD6" stroke-width="1.5"/><text x="445.0" y="381.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">mem = kalloc()</text><text x="445.0" y="398.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">memmove(mem, pa, PGSIZE)</text><text x="445.0" y="414.90000000000003" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">mappages(new, va, mem, flags)</text><path d="M185,265 L165,265 L165,348" fill="none" stroke="#E07A2E" stroke-width="2" marker-end="url(#aE07A2E)" stroke-linejoin="round"/><text x="200" y="252.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#E07A2E" text-anchor="middle" dominant-baseline="middle">Có</text><path d="M415,265 L445,265 L445,348" fill="none" stroke="#2F6FD6" stroke-width="2" marker-end="url(#a2F6FD6)" stroke-linejoin="round"/><text x="410" y="252.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#2F6FD6" text-anchor="middle" dominant-baseline="middle">Không</text><polygon points="300,490.0 415.0,530 300,570.0 185.0,530" fill="#F1F2F4" stroke="#6B7280" stroke-width="1.5"/><text x="300" y="530.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Còn trang?</text><path d="M165,446 L165,478 L300,478" fill="none" stroke="#6B7280" stroke-width="2" stroke-linejoin="round"/><path d="M445,446 L445,478 L300,478" fill="none" stroke="#6B7280" stroke-width="2" stroke-linejoin="round"/><path d="M300,478 L300,488" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a6B7280)" stroke-linejoin="round"/><path d="M185,530 L30,530 L30,175 L148,175" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a6B7280)" stroke-dasharray="6 4" stroke-linejoin="round"/><text x="60" y="515.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" dominant-baseline="middle">Có</text><rect x="150" y="610" width="300" height="56" rx="8" fill="#E3F4EC" stroke="#23966A" stroke-width="1.5"/><text x="300.0" y="629.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Con chạy: cha và con</text><text x="300.0" y="646.4499999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">cùng thấy trang chung (refcnt = 2)</text><path d="M300,570 L300,608" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a6B7280)" stroke-linejoin="round"/><text x="318" y="590.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start" dominant-baseline="middle">Không</text><rect x="40" y="700" width="520" height="100" rx="8" fill="#FBE4E4" stroke="#D14343" stroke-width="1.5"/><text x="300.0" y="733.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Lỗi giữa chừng (kalloc trả 0): uvmunmap(new, 0, i, 1)</text><text x="300.0" y="750.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">→ kfree() giảm refcnt các trang chung đã kref_inc,</text><text x="300.0" y="766.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">không giải phóng nhầm trang của cha</text><rect x="750" y="150" width="300" height="50" rx="8" fill="#E3F4EC" stroke="#23966A" stroke-width="1.5"/><text x="900.0" y="175.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">uvmunmap(pt, 0, npages, do_free = 1)</text><path d="M900,114 L900,148" fill="none" stroke="#23966A" stroke-width="2" marker-end="url(#a23966A)" stroke-linejoin="round"/><rect x="750" y="240" width="300" height="50" rx="8" fill="#E3F4EC" stroke="#23966A" stroke-width="1.5"/><text x="900.0" y="265.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">kfree(pa)  với mỗi trang</text><path d="M900,200 L900,238" fill="none" stroke="#23966A" stroke-width="2" marker-end="url(#a23966A)" stroke-linejoin="round"/><rect x="750" y="330" width="300" height="50" rx="8" fill="#F1F2F4" stroke="#6B7280" stroke-width="1.5"/><text x="900.0" y="355.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">acquire(kref.lock);  left = --refcnt[pa]</text><path d="M900,290 L900,328" fill="none" stroke="#23966A" stroke-width="2" marker-end="url(#a23966A)" stroke-linejoin="round"/><polygon points="900,425.0 1015.0,470 900,515.0 785.0,470" fill="#FDEBDD" stroke="#E07A2E" stroke-width="1.5"/><text x="900" y="470.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">left == 0 ?</text><path d="M900,380 L900,423" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a6B7280)" stroke-linejoin="round"/><rect x="640" y="580" width="240" height="80" rx="8" fill="#E6EEFB" stroke="#2F6FD6" stroke-width="1.5"/><text x="760.0" y="611.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Trả trang về freelist</text><text x="760.0" y="628.4499999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">(memset junk, kmem.lock)</text><rect x="920" y="580" width="240" height="80" rx="8" fill="#FDEBDD" stroke="#E07A2E" stroke-width="1.5"/><text x="1040.0" y="611.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">return — giữ trang</text><text x="1040.0" y="628.4499999999999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">tiến trình khác còn dùng</text><path d="M785,470 L760,470 L760,578" fill="none" stroke="#2F6FD6" stroke-width="2" marker-end="url(#a2F6FD6)" stroke-linejoin="round"/><text x="800" y="456.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#2F6FD6" text-anchor="middle" dominant-baseline="middle">Có</text><path d="M1015,470 L1040,470 L1040,578" fill="none" stroke="#E07A2E" stroke-width="2" marker-end="url(#aE07A2E)" stroke-linejoin="round"/><text x="1000" y="456.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#E07A2E" text-anchor="middle" dominant-baseline="middle">Không</text><rect x="640" y="700" width="520" height="100" rx="8" fill="#F1F2F4" stroke="#C9CDD3" stroke-width="1.5"/><text x="900.0" y="733.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Ví dụ: con thoát trước → refcnt 2 → 1, trang vẫn còn cho cha.</text><text x="900.0" y="750.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Cha thoát sau → refcnt 1 → 0, trang mới thực sự được giải phóng.</text><text x="900.0" y="766.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="middle">Không còn double-free, uvmunmap() không cần sửa.</text></svg>